name: Update athlete data

# Run manually from the Actions tab whenever you want fresh data,
# and automatically once a week so the game doesn't go stale.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scraper/requirements.txt

      - run: |
          python scraper/scrape_athletes.py \
            --urls scraper/athlete_urls.txt \
            --out data/athletes.json \
            --delay 3

      - name: Commit updated data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/athletes.json
          git diff --staged --quiet || git commit -m "Update athlete data"
          git push
